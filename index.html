<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cofre Sonoro Minecraft — Con Debounce Anti-Rebote</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #181818;
      color: #fff;
      margin: 0;
      gap: 15px;
    }
    #estado {
      font-size: 2.2rem;
      font-weight: bold;
      padding: 20px 40px;
      border-radius: 10px;
      border: 3px solid #444;
    }
    .abierto { background: #2e7d32; }
    .cerrado { background: #c62828; }
    .btn-test {
      background: #333;
      color: #fff;
      border: 1px solid #777;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    #consola {
      font-family: monospace;
      background: #000;
      padding: 12px 20px;
      border-radius: 6px;
      color: #00ff88;
      min-width: 320px;
      text-align: center;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <div id="estado" class="abierto">Cofre Abierto</div>
  <div id="consola">Haz clic en la pantalla y presiona tu tecla</div>

  <div>
    <button class="btn-test" onclick="probarCerrar()">Probar Audio Cerrar</button>
    <button class="btn-test" onclick="probarAbrir()">Probar Audio Abrir</button>
    <button class="btn-test" onclick="reiniciarTecla()" style="background: #442222; border-color: #994444;">Reiniciar Tecla</button>
  </div>

  <script>
    const sndCerrar = new Audio('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/sounds/block/chest/close.ogg');
    const sndAbrir  = new Audio('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/sounds/block/chest/open.ogg');

    const estado = document.getElementById('estado');
    const consola = document.getElementById('consola');

    let teclaDefinida = null;
    let contactoCerrado = false;   // estado LÓGICO ya confirmado (post-debounce)

    // --- Parámetros de debounce ---
    // Tiempo mínimo (ms) que debe pasar entre un evento válido y el siguiente
    // para que se considere "real" y no un rebote del contacto mecánico.
    const DEBOUNCE_MS = 120;

    let ultimoEventoValidoTs = 0;   // timestamp del último cambio de estado aceptado
    let timerDown = null;           // temporizador pendiente para keydown
    let timerUp = null;             // temporizador pendiente para keyup

    function probarCerrar() {
      sndCerrar.currentTime = 0;
      sndCerrar.play().catch(e => alert("Error audio: " + e.message));
    }

    function probarAbrir() {
      sndAbrir.currentTime = 0;
      sndAbrir.play().catch(e => alert("Error audio: " + e.message));
    }

    function reiniciarTecla() {
      teclaDefinida = null;
      contactoCerrado = false;
      ultimoEventoValidoTs = 0;
      clearTimeout(timerDown);
      clearTimeout(timerUp);
      estado.textContent = 'Cofre Abierto';
      estado.className = 'abierto';
      consola.textContent = "Configuración reiniciada. Presiona la tecla que usarás.";
    }

    function confirmarCierre() {
      // Se ejecuta solo si, tras DEBOUNCE_MS, la tecla sigue abajo
      // (ver lógica en keydown: cancelamos este timer si llega un keyup antes)
      if (contactoCerrado) return; // ya estaba cerrado, no repetir
      contactoCerrado = true;
      ultimoEventoValidoTs = performance.now();

      estado.textContent = 'Cofre Cerrado';
      estado.className = 'cerrado';
      consola.textContent = `Cofre CERRADO (confirmado) -> ${teclaDefinida}`;

      sndCerrar.currentTime = 0;
      sndCerrar.play().catch(err => console.log(err));
    }

    function confirmarApertura() {
      if (!contactoCerrado) return; // ya estaba abierto, no repetir
      contactoCerrado = false;
      ultimoEventoValidoTs = performance.now();

      estado.textContent = 'Cofre Abierto';
      estado.className = 'abierto';
      consola.textContent = `Cofre ABIERTO (confirmado) -> ${teclaDefinida}`;

      sndAbrir.currentTime = 0;
      sndAbrir.play().catch(err => console.log(err));
    }

    window.addEventListener('keydown', (e) => {
      // Primera pulsación define automáticamente qué tecla usar
      if (!teclaDefinida) {
        teclaDefinida = e.code;
        consola.textContent = `¡Tecla asignada! Usando: ${e.code} (${e.key})`;
        return;
      }

      if (e.code !== teclaDefinida) return;

      // El navegador dispara keydown repetidamente mientras la tecla
      // sigue presionada (auto-repeat) o por rebote del contacto.
      // Si ya hay un timer de cierre pendiente o ya está cerrado, ignoramos.
      if (contactoCerrado) return;

      // Si había un timer de APERTURA pendiente (por un rebote que soltó
      // brevemente el contacto), lo cancelamos: significa que fue rebote,
      // no una apertura real.
      clearTimeout(timerUp);
      timerUp = null;

      // Si ya hay un timer de cierre esperando, no crear otro
      if (timerDown) return;

      // Esperamos DEBOUNCE_MS para confirmar que el contacto se quedó
      // realmente cerrado (no fue solo un rebote pasajero)
      timerDown = setTimeout(() => {
        timerDown = null;
        confirmarCierre();
      }, DEBOUNCE_MS);
    });

    window.addEventListener('keyup', (e) => {
      if (!teclaDefinida || e.code !== teclaDefinida) return;

      if (!contactoCerrado) return; // ya estaba abierto, nada que hacer

      // Cancelamos cualquier timer de cierre pendiente que no se
      // haya confirmado todavía (rebote rapidísimo)
      clearTimeout(timerDown);
      timerDown = null;

      if (timerUp) return;

      timerUp = setTimeout(() => {
        timerUp = null;
        confirmarApertura();
      }, DEBOUNCE_MS);
    });
  </script>
</body>
</html>
